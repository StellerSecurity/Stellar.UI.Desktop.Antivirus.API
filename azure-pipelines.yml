# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.
# Add steps that run tests and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/php

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: 'c15f9b41-b47d-4ea3-9f1f-c3da1406bc75'

  # Web app name
  webAppName: 'StellarUIDesktopAntivirusApiProd'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'StellarUIDesktopAntivirusApiProd'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        sudo update-alternatives --set php /usr/bin/php$(phpVersion)
        sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
        sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
        sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
        sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
        php -version
      workingDirectory: $(rootFolder)
      displayName: 'Use PHP version $(phpVersion)'

    - task: AzureCLI@2
      displayName: 'Recover verified dependency versions'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)"
          test ! -e composer.lock
          az rest --method get \
            --uri 'https://stellaruidesktopantivirusapiprod.scm.azurewebsites.net/api/vfs/site/wwwroot/composer.lock' \
            --resource 'https://management.azure.com/' \
            --only-show-errors --output json > composer.lock
          python3 - <<'STELLAR_VERIFY_LOCK'
          import hashlib
          import json
          from pathlib import Path

          def digest(path):
              data = json.loads(Path(path).read_text())
              canonical = json.dumps(data, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(canonical).hexdigest()

          if digest('composer.json') != 'ea1fa954946498e8cd4c367e36abc6b2e3c59833a918e4b555a63758ab1efe62':
              raise SystemExit('Composer manifest changed; review the deployment lock before continuing.')
          if digest('composer.lock') != '7ff93b2a254b2f26f2dafcf3a58305baffca2f1768f5d1ab6f0d39e96ec5cae7':
              raise SystemExit('Deployment lock changed; package review is required before continuing.')
          print('Verified existing dependency versions. No dependency update requested.')
          STELLAR_VERIFY_LOCK

    - script: composer install --no-interaction --prefer-dist --optimize-autoloader
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(rootFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : StellarUIDesktopAntivirusApiProd'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              appType: webAppLinux
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip